name: Deploy Functions

# Si attiva su push a main quando cambiano le Functions o il DB dell'evento.
# Puoi anche avviarlo a mano da GitHub → Actions → Run workflow.
on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'
      - 'usopen_db.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Le Functions leggono la loro copia del tabellone: la riallineiamo sempre
      # a quella di radice, così i due file non possono divergere.
      - name: Sync event DB into functions
        run: cp usopen_db.json functions/usopen_db.json

      - name: Install Functions dependencies
        run: npm install
        working-directory: functions

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Deploy Functions
        run: firebase deploy --only functions --project medusino-2026 --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
